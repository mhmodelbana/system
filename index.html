<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="نظام إدارة سوبر ماركت بنا للمخزون والمبيعات في مصر">
    <title>نظام إدارة سوبر ماركت بنا</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen" class="screen">
            <div class="login-container">
                <div class="login-header">
                    <i class="fas fa-store"></i>
                    <div>
                        <h1>سوبر ماركت بنا</h1>
                        <p class="brand-tagline">نظام مصري متكامل لإدارة المخزون والمبيعات</p>
                    </div>
                </div>
                <form id="login-form" autocomplete="off">
                    <div class="form-group">
                        <label>اسم المستخدم</label>
                        <input type="text" id="username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
                </form>
            </div>
        </div>

        <!-- الشاشة الرئيسية -->
        <div id="main-screen" class="screen hidden">
            <!-- القائمة الجانبية -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <i class="fas fa-store"></i>
                    <h2>سوبر ماركت بنا</h2>
                </div>
                <nav class="sidebar-nav" role="navigation" aria-label="القائمة الرئيسية">
                    <a href="#" class="nav-item active" data-page="dashboard">
                        <i class="fas fa-home"></i>
                        <span>الرئيسية</span>
                    </a>
                    <a href="#" class="nav-item" data-page="pos">
                        <i class="fas fa-cash-register"></i>
                        <span>نقطة البيع</span>
                    </a>
                    <a href="#" class="nav-item" data-page="products">
                        <i class="fas fa-boxes"></i>
                        <span>المنتجات</span>
                    </a>
                    <a href="#" class="nav-item" data-page="inventory">
                        <i class="fas fa-warehouse"></i>
                        <span>المخزون</span>
                    </a>
                    <a href="#" class="nav-item" data-page="suppliers">
                        <i class="fas fa-truck"></i>
                        <span>الموردين</span>
                    </a>
                    <a href="#" class="nav-item" data-page="purchases">
                        <i class="fas fa-shopping-cart"></i>
                        <span>المشتريات</span>
                    </a>
                    <a href="#" class="nav-item" data-page="sales">
                        <i class="fas fa-file-invoice-dollar"></i>
                        <span>الفواتير</span>
                    </a>
                    <a href="#" class="nav-item" data-page="customers">
                        <i class="fas fa-users"></i>
                        <span>العملاء</span>
                    </a>
                    <a href="#" class="nav-item" data-page="discounts">
                        <i class="fas fa-tags"></i>
                        <span>العروض والخصومات</span>
                    </a>
                    <a href="#" class="nav-item" data-page="reports">
                        <i class="fas fa-chart-bar"></i>
                        <span>التقارير</span>
                    </a>
                    <a href="#" class="nav-item" data-page="users">
                        <i class="fas fa-user-cog"></i>
                        <span>المستخدمين</span>
                    </a>
                    <a href="#" class="nav-item" data-page="branches">
                        <i class="fas fa-building"></i>
                        <span>الفروع</span>
                    </a>
                    <a href="#" class="nav-item" data-page="settings">
                        <i class="fas fa-cog"></i>
                        <span>الإعدادات</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <button id="logout-btn" type="button" class="btn btn-danger">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>تسجيل الخروج</span>
                    </button>
                </div>
            </aside>

            <!-- المحتوى الرئيسي -->
            <main class="main-content">
                <header class="top-bar">
                    <div class="top-bar-left">
                        <button id="mobile-menu-btn" type="button" class="icon-btn mobile-menu-btn" aria-label="فتح القائمة">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h1 id="page-title">الرئيسية</h1>
                    </div>
                    <div class="top-bar-right">
                        <div class="notifications">
                            <button id="notifications-btn" type="button" class="icon-btn" aria-label="الإشعارات">
                                <i class="fas fa-bell"></i>
                                <span class="badge" id="notification-count">0</span>
                            </button>
                        </div>
                        <div class="user-info">
                            <span id="current-user-name">المدير</span>
                            <i class="fas fa-user-circle"></i>
                        </div>
                    </div>
                </header>

                <!-- صفحات المحتوى -->
                <div id="content-area">
                    <!-- سيتم تحميل الصفحات هنا -->
                </div>
            </main>
        </div>

        <!-- النوافذ المنبثقة -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modal-title">عنوان النافذة</h3>
                    <button type="button" class="modal-close" aria-label="إغلاق">&times;</button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- محتوى النافذة -->
                </div>
            </div>
        </div>

        <!-- التنبيهات -->
        <div id="toast-container"></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/pos.js"></script>
    <script src="js/users.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/suppliers.js"></script>
    <script src="js/purchases.js"></script>
    <script src="js/customers.js"></script>
    <script src="js/discounts.js"></script>
    <script src="js/branches.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
